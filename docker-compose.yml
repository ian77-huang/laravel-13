services:
  mysql:
    image: mysql:8.4
    container_name: my-new-laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-my_new_laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      TZ: Asia/Taipei
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - ./docker/mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: my-new-laravel-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - ./docker/redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  memcached:
    image: memcached:1.6-alpine
    container_name: my-new-laravel-memcached
    restart: unless-stopped
    ports:
      - "${MEMCACHED_PORT:-11211}:11211"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo stats | nc 127.0.0.1 11211 | grep -q STAT"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: my-new-laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: my_new_laravel
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      CACHE_STORE: memcached
      OCTANE_SERVER: swoole
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      memcached:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction &&
             [ -d node_modules ] || npm install --no-audit --no-fund &&
             php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --watch"

  nginx:
    image: nginx:1.27-alpine
    container_name: my-new-laravel-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
