services:
  mysql:
    image: mysql:8.4
    container_name: my-new-laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-my_new_laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      TZ: Asia/Taipei
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - ./docker/mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: my-new-laravel-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - ./docker/redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: my_new_laravel
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction &&
             [ -d node_modules ] || npm install --no-audit --no-fund &&
             php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --watch"
