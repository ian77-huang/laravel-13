name: my-new-laravel-dev

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  depends_on:
    memcached:
      condition: service_healthy
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  command: >
    sh -c "flock /var/www/html/.setup.lock composer install --no-interaction &&
           flock /var/www/html/.setup.lock sh -c '[ -d node_modules ] || npm install --no-audit --no-fund' &&
           php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --watch"
  healthcheck:
    test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 45s

x-app-env: &app-env
  APP_ENV: local
  APP_DEBUG: "true"
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-my_new_laravel}
  DB_USERNAME: root
  DB_PASSWORD: ${DB_PASSWORD:-root}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MEMCACHED_HOST: memcached
  MEMCACHED_PORT: 11211
  CACHE_STORE: memcached
  OCTANE_SERVER: swoole

services:
  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: ["-m", "0"]
    ports:
      - "${MEMCACHED_PORT:-11211}:11211"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo stats | nc 127.0.0.1 11211 | grep -q STAT"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-my_new_laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      TZ: Asia/Taipei
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - ./docker/mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - ./docker/redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_NAME: app1

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_NAME: app2

  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_NAME: app3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
