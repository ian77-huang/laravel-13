name: my-new-laravel-prod

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
    args:
      VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
      VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - octane_public:/var/www/html/public-runtime
  depends_on:
    memcached:
      condition: service_healthy
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  command: >
    sh -c "cp -r /var/www/html/public/. /var/www/html/public-runtime/ &&
           php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000"
  healthcheck:
    test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 45s

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Laravel}
  APP_ENV: production
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL:-http://localhost}
  APP_DEBUG: "false"
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD:-}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  REDIS_CLIENT: ${REDIS_CLIENT:-predis}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  MEMCACHED_HOST: memcached
  MEMCACHED_PORT: 11211
  CACHE_STORE: memcached
  OCTANE_SERVER: swoole
  REVERB_APP_ID: ${REVERB_APP_ID:-}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
  REVERB_HOST: ${REVERB_HOST:-localhost}
  REVERB_PORT: ${REVERB_PORT:-443}
  REVERB_SCHEME: ${REVERB_SCHEME:-https}

services:
  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: ["-m", "512"]
    ports:
      - "${MEMCACHED_PORT:-11211}:11211"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo stats | nc 127.0.0.1 11211 | grep -q STAT"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-my_new_laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      TZ: Asia/Taipei
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_NAME: app1

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    environment:
      <<: *app-env
      INSTANCE_NAME: queue
    depends_on:
      memcached:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "cp -r /usr/local/etc/php/conf.d /tmp/confd &&
             rm -f /tmp/confd/*swoole*.ini &&
             PHP_INI_SCAN_DIR=/tmp/confd php artisan reverb:start --host=0.0.0.0 --port=8080"
    ports:
      - "${REVERB_SERVER_PORT:-8080}:8080"
    environment:
      <<: *app-env
      INSTANCE_NAME: reverb
    depends_on:
      memcached:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - octane_public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy

volumes:
  octane_public:
  mysql_data:
  redis_data:
