name: my-new-laravel-prod

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - octane_public:/var/www/html/public-runtime
  depends_on:
    memcached:
      condition: service_healthy
  command: >
    sh -c "cp -r /var/www/html/public/. /var/www/html/public-runtime/ &&
           php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000"
  healthcheck:
    test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 45s

x-app-env: &app-env
  APP_ENV: production
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL:-http://localhost}
  APP_DEBUG: "false"
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  MEMCACHED_HOST: memcached
  MEMCACHED_PORT: 11211
  CACHE_STORE: memcached
  OCTANE_SERVER: swoole

services:
  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: ["-m", "0"]
    ports:
      - "${MEMCACHED_PORT:-11211}:11211"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo stats | nc 127.0.0.1 11211 | grep -q STAT"]
      interval: 10s
      timeout: 5s
      retries: 5

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_NAME: app1

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_NAME: app2

  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_NAME: app3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - octane_public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy

volumes:
  octane_public:
